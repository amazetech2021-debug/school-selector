name: 自动构建择校系统

on:
  push:
    branches: [main]
    paths:
      - 'data/学校信息表.xlsx'
      - 'build/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install pandas openpyxl

      - name: 运行构建脚本
        run: python build/build.py

      - name: 提交并推送 index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html build/school_coords.json
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "🤖 自动构建: 更新 index.html ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
